name: CI

on:
  push:
    branches:
      - main
  pull_request:

# macOS only: trier routes URLs through Launch Services and AppKit, and the
# crate refuses to compile elsewhere.
jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "trier/gh-actions-cache"

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run test
        run: cargo test --verbose

  coverage:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Nightly so that `#[cfg_attr(coverage_nightly, coverage(off))]` takes
      # effect: cargo-llvm-cov only sets `coverage_nightly` under nightly.
      # `rust-toolchain.toml` pins stable, hence `cargo +nightly` below.
      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Setup cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "trier/gh-actions-cache"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate code coverage
        run: cargo +nightly llvm-cov --all-features --workspace --codecov --output-path codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          fail_ci_if_error: true

  build:
    name: build (aarch64-apple-darwin)
    runs-on: macos-15
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-apple-darwin

      - name: Setup cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "trier/gh-actions-cache"

      - name: Build
        run: cargo build --verbose --target aarch64-apple-darwin
